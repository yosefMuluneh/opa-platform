services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: opa_dev
      POSTGRES_USER: opa
      POSTGRES_PASSWORD: opa_dev_password
    ports: ["5433:5432"]
    volumes: ["opa_postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opa -d opa_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  opa_postgres_data:
